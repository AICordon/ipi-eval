[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ipi-eval-llmail"
version = "0.1.0"
description = "An AI Cordon detector added to Table 3 of LLMail-Inject, by the paper's rule"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aicordon>=1.3"]

[tool.setuptools]
packages = ["llmail_eval"]
