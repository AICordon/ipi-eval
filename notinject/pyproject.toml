[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ipi-eval-notinject"
version = "0.1.0"
description = "An AI Cordon detector on NotInject, by the PIGuard protocol"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aicordon>=1.3"]

[tool.setuptools]
packages = ["notinject_eval"]
